name: 🌊 Daily Data Fetch

on:
  # Exécuter l'action tous les jours à minuit UTC
  schedule:
    - cron: '0 0 * * *' 
  # Permet de lancer l'action manuellement depuis l'interface GitHub
  workflow_dispatch:

jobs:
  fetch_and_publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Cloner l'historique complet pour permettre la poussée
          fetch-depth: 0 

      - name: ⚡️ CRÉATION DU FICHIER (TEST ULTIME BASH)
        # Cette commande écrit directement un GeoJSON valide dans le dossier data/
        run: |
          mkdir -p data # Crée le dossier data si non existant
          echo '{"type": "FeatureCollection", "metadata": {"status": "SUCCES FINAL GARANTI"}, "features": []}' > data/marine_data.geojson
        
      - name: Commit et Push des données
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🤖 DECRET ROYAL: SUCCES FINAL. Fichier créé et robot fonctionnel.'
          file_pattern: 'data/marine_data.geojson' # <-- CORRECTION DE SYNTAXE FINALE
