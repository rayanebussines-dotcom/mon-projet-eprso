name: 🌊 Daily Data Fetch

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch:

jobs:
  fetch_and_publish:
    runs-on: ubuntu-latest
    
    # Permission essentielle pour le commit :
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install requests 

      - name: 🏃 EXÉCUTION DU SCRIPT PYTHON (Données réelles)
        run: python scripts/fetch_data.py
        
      - name: Commit et Push des données
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🤖 DECRET ROYAL: Mise à jour des données météo marine.'
          file_pattern: 'data/marine_data.geojson'
